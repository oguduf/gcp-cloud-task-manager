name: Build & deploy to GCE (OIDC)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-gce.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required: lets the job mint a GitHub OIDC token for GCP

concurrency:
  group: deploy-gce
  cancel-in-progress: false  # never kill a deploy halfway through

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  MIG: ${{ vars.GCP_MIG_NAME }}
  BASE_TEMPLATE_PREFIX: ${{ vars.GCP_TEMPLATE_PREFIX }}
  LB_IP_NAME: ${{ vars.GCP_LB_IP_NAME }}
  DOMAIN: ${{ vars.GCP_DOMAIN_NAME }}
  BACKEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/employee-backend
  FRONTEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/employee-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and test
        run: npm ci && npm test

  build-and-deploy:
    needs: test
    # Terraform must create the regional MIG and baseline template first.
    # The first deployment is manual; subsequent main-branch pushes deploy automatically.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 1) GitHub OIDC token -> GCP STS -> short-lived token for the deployer SA.
      #    No JSON key anywhere.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # 2) Build immutable frontend and backend images and push to Artifact Registry.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push images
        run: |
          docker build -t "${BACKEND_IMAGE}:${GITHUB_SHA}" ./backend
          docker build -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" ./frontend
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      # 3) Clone the immutable baseline template with the new image references.
      #    The startup script runs both images on each private MIG instance.
      - name: Create release template and roll the regional MIG
        run: |
          BASE_TEMPLATE="$(gcloud compute instance-templates list \
            --filter="name~${BASE_TEMPLATE_PREFIX}" \
            --sort-by='~creationTimestamp' --limit=1 --format='value(name)')"
          test -n "$BASE_TEMPLATE"
          TEMPLATE="${BASE_TEMPLATE_PREFIX%-template-}-release-${GITHUB_SHA:0:12}"
          BASE_CONFIG="$(mktemp)"
          RELEASE_CONFIG="$(mktemp)"
          OPERATION="$(mktemp)"
          trap 'rm -f "$BASE_CONFIG" "$RELEASE_CONFIG" "$OPERATION"' EXIT
          gcloud compute instance-templates describe "$BASE_TEMPLATE" --format=json > "$BASE_CONFIG"
          python3 - "$BASE_CONFIG" "$RELEASE_CONFIG" "$TEMPLATE" \
            "${BACKEND_IMAGE}:${GITHUB_SHA}" "${FRONTEND_IMAGE}:${GITHUB_SHA}" <<'PY'
          import json
          import sys
          from pathlib import Path

          source, destination, name, backend_image, frontend_image = sys.argv[1:]
          template = json.loads(Path(source).read_text())
          for field in ("id", "creationTimestamp", "selfLink", "kind", "region"):
              template.pop(field, None)
          template["name"] = name
          properties = template.get("properties", {})
          metadata = properties.get("metadata", {})
          metadata.pop("fingerprint", None)
          found = set()
          for item in metadata.get("items", []):
              if item.get("key") == "app-backend-image":
                  item["value"] = backend_image
                  found.add("app-backend-image")
              elif item.get("key") == "app-frontend-image":
                  item["value"] = frontend_image
                  found.add("app-frontend-image")
          missing = {"app-backend-image", "app-frontend-image"} - found
          if missing:
              raise SystemExit(f"Baseline template is missing metadata keys: {sorted(missing)}")
          for interface in properties.get("networkInterfaces", []):
              interface.pop("name", None)
          Path(destination).write_text(json.dumps(template))
          PY
          if gcloud compute instance-templates describe "$TEMPLATE" --format=json > "$OPERATION" 2>/dev/null; then
            python3 - "$OPERATION" "${BACKEND_IMAGE}:${GITHUB_SHA}" "${FRONTEND_IMAGE}:${GITHUB_SHA}" <<'PY'
          import json
          import sys
          template = json.load(open(sys.argv[1]))
          expected = {
              "app-backend-image": sys.argv[2],
              "app-frontend-image": sys.argv[3],
          }
          actual = {item.get("key"): item.get("value") for item in template.get("properties", {}).get("metadata", {}).get("items", [])}
          mismatches = [key for key, value in expected.items() if actual.get(key) != value]
          if mismatches:
              raise SystemExit(f"Existing release template has unexpected image metadata: {mismatches}")
          print("Reusing the matching release template created by an earlier attempt.")
          PY
          else
            ACCESS_TOKEN="$(gcloud auth print-access-token)"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${RELEASE_CONFIG}" \
              "https://compute.googleapis.com/compute/v1/projects/${PROJECT_ID}/global/instanceTemplates" \
              > "$OPERATION"
            OPERATION_NAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$OPERATION")"
            OPERATION_STATUS="PENDING"
            for attempt in $(seq 1 60); do
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "https://compute.googleapis.com/compute/v1/projects/${PROJECT_ID}/global/operations/${OPERATION_NAME}" \
                > "$OPERATION"
              OPERATION_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", "UNKNOWN"))' "$OPERATION")"
              if [ "$OPERATION_STATUS" = "DONE" ]; then
                python3 - "$OPERATION" <<'PY'
          import json
          import sys
          operation = json.load(open(sys.argv[1]))
          errors = operation.get("error", {}).get("errors", [])
          if errors:
              raise SystemExit("; ".join(error.get("message", str(error)) for error in errors))
          PY
                break
              fi
              sleep 5
            done
            test "$OPERATION_STATUS" = "DONE"
          fi
          gcloud compute instance-groups managed rolling-action start-update "$MIG" \
            --region "$REGION" \
            --version="template=${TEMPLATE}" \
            --max-surge=3 \
            --max-unavailable=0
          gcloud compute instance-groups managed wait-until "$MIG" \
            --region "$REGION" --stable --timeout=20m
          healthy_mig=false
          for attempt in $(seq 1 40); do
            INSTANCES="$(gcloud compute instance-groups managed list-instances "$MIG" --region "$REGION" --format=json)"
            if printf '%s' "$INSTANCES" | python3 -c 'import json,sys; items=json.load(sys.stdin); healthy=sum(1 for item in items if item.get("instanceStatus")=="RUNNING" and item.get("currentAction")=="NONE" and any(h.get("healthState")=="HEALTHY" for h in item.get("instanceHealth",[]))); print(f"Healthy MIG instances: {healthy}/{len(items)}"); sys.exit(0 if healthy >= 2 else 1)'; then
              healthy_mig=true
              break
            fi
            sleep 30
          done
          test "$healthy_mig" = true

      # 4) Hit the public load balancer and exercise the database health path.
      - name: Smoke test
        run: |
          IP="$(gcloud compute addresses describe "$LB_IP_NAME" --global --format='value(address)')"
          if [ -n "$DOMAIN" ]; then URL="https://${DOMAIN}"; else URL="http://${IP}"; fi
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "${URL}/healthz"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${URL}/api/health"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "${URL}/"
          {
            echo "### Deployment verified"
            echo "- Backend: \`${BACKEND_IMAGE}:${GITHUB_SHA}\`"
            echo "- Frontend: \`${FRONTEND_IMAGE}:${GITHUB_SHA}\`"
            echo "- URL: ${URL}"
            echo "- Release template: ${BASE_TEMPLATE_PREFIX%-template-}-release-${GITHUB_SHA:0:12}"
          } >> "$GITHUB_STEP_SUMMARY"
