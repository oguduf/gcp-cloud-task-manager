name: Build & deploy to GCE (OIDC)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy-gce.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required: lets the job mint a GitHub OIDC token for GCP

concurrency:
  group: deploy-gce
  cancel-in-progress: false  # never kill a deploy halfway through

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ZONE: ${{ vars.GCP_ZONE }}
  VM: ${{ vars.GCE_VM_NAME }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/profile-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 1) GitHub OIDC token -> GCP STS -> short-lived token for the deployer SA.
      #    No JSON key anywhere.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # 2) Build the image and push it to Artifact Registry.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      # 3) Ship compose + deploy script to the VM over IAP (no public SSH port,
      #    no SSH key stored in GitHub - OS Login issues a short-lived one).
      - name: Copy deploy files to the VM
        run: |
          SSH_FLAGS=(--zone "$ZONE" --tunnel-through-iap --quiet --strict-host-key-checking=no)
          gcloud compute ssh "$VM" "${SSH_FLAGS[@]}" --command "mkdir -p /tmp/profile-app"
          gcloud compute scp deploy/docker-compose.yml deploy/deploy.sh \
            "$VM:/tmp/profile-app/" "${SSH_FLAGS[@]}"

      # 4) On the VM: read the Firestore connection string from instance metadata,
      #    pull the new image (VM's own SA), docker compose up, check /healthz
      #    and a real Firestore read (/get-profile).
      - name: Deploy on the VM
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --strict-host-key-checking=no \
            --command "sudo bash /tmp/profile-app/deploy.sh '${IMAGE}:${GITHUB_SHA}'"

      # 5) Hit the public endpoint from outside.
      - name: Smoke test
        run: |
          IP="$(gcloud compute instances describe "$VM" --zone "$ZONE" \
                --format='get(networkInterfaces[0].accessConfigs[0].natIP)')"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "http://${IP}/healthz"
          curl -fsS "http://${IP}/get-profile"   # end-to-end: app -> Firestore
          {
            echo "### Deployed :rocket:"
            echo "- Image: \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- URL: http://${IP}"
          } >> "$GITHUB_STEP_SUMMARY"
