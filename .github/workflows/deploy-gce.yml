name: Build & deploy to GCE (OIDC)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/deploy-gce.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required: lets the job mint a GitHub OIDC token for GCP

concurrency:
  group: deploy-gce
  cancel-in-progress: false  # never kill a deploy halfway through

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  MIG: ${{ vars.GCP_MIG_NAME }}
  BASE_TEMPLATE_PREFIX: ${{ vars.GCP_TEMPLATE_PREFIX }}
  LB_IP_NAME: ${{ vars.GCP_LB_IP_NAME }}
  DOMAIN: ${{ vars.GCP_DOMAIN_NAME }}
  BACKEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/employee-backend
  FRONTEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/employee-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and test
        run: npm ci && npm test

  build-and-deploy:
    needs: test
    # Terraform must create the regional MIG and baseline template first.
    # Run manually for the first image; enable AUTO_DEPLOY after it succeeds.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 1) GitHub OIDC token -> GCP STS -> short-lived token for the deployer SA.
      #    No JSON key anywhere.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # 2) Build immutable frontend and backend images and push to Artifact Registry.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push images
        run: |
          docker build -t "${BACKEND_IMAGE}:${GITHUB_SHA}" ./backend
          docker build -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" ./frontend
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"

      # 3) Clone the immutable baseline template with the new image references.
      #    The startup script runs both images on each private MIG instance.
      - name: Create release template and roll the regional MIG
        run: |
          BASE_TEMPLATE="$(gcloud compute instance-templates list \
            --filter="name~${BASE_TEMPLATE_PREFIX}" \
            --sort-by='~creationTimestamp' --limit=1 --format='value(name)')"
          test -n "$BASE_TEMPLATE"
          TEMPLATE="${BASE_TEMPLATE_PREFIX%-template-}-release-${GITHUB_SHA:0:12}"
          gcloud compute instance-templates create "$TEMPLATE" \
            --source-instance-template="$BASE_TEMPLATE" \
            --metadata="app-backend-image=${BACKEND_IMAGE}:${GITHUB_SHA},app-frontend-image=${FRONTEND_IMAGE}:${GITHUB_SHA}"
          gcloud compute instance-groups managed rolling-action start-update "$MIG" \
            --region "$REGION" \
            --version="template=${TEMPLATE}" \
            --max-surge=1 \
            --max-unavailable=0
          gcloud compute instance-groups managed wait-until "$MIG" \
            --region "$REGION" --stable --timeout=20m
          healthy_mig=false
          for attempt in $(seq 1 40); do
            INSTANCES="$(gcloud compute instance-groups managed list-instances "$MIG" --region "$REGION" --format=json)"
            if printf '%s' "$INSTANCES" | python3 -c 'import json,sys; items=json.load(sys.stdin); healthy=sum(1 for item in items if item.get("instanceStatus")=="RUNNING" and item.get("currentAction")=="NONE" and any(h.get("healthState")=="HEALTHY" for h in item.get("instanceHealth",[]))); print(f"Healthy MIG instances: {healthy}/{len(items)}"); sys.exit(0 if healthy >= 2 else 1)'; then
              healthy_mig=true
              break
            fi
            sleep 30
          done
          test "$healthy_mig" = true

      # 4) Hit the public load balancer and exercise the database health path.
      - name: Smoke test
        run: |
          IP="$(gcloud compute addresses describe "$LB_IP_NAME" --global --format='value(address)')"
          if [ -n "$DOMAIN" ]; then URL="https://${DOMAIN}"; else URL="http://${IP}"; fi
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "${URL}/healthz"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${URL}/api/health"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "${URL}/"
          {
            echo "### Deployment verified"
            echo "- Backend: \`${BACKEND_IMAGE}:${GITHUB_SHA}\`"
            echo "- Frontend: \`${FRONTEND_IMAGE}:${GITHUB_SHA}\`"
            echo "- URL: ${URL}"
            echo "- Release template: ${BASE_TEMPLATE_PREFIX%-template-}-release-${GITHUB_SHA:0:12}"
          } >> "$GITHUB_STEP_SUMMARY"
